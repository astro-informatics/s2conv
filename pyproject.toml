[build-system]
requires = [
    "setuptools>=77",
    "setuptools-scm>=8",
]
build-backend = "setuptools.build_meta"

[project]
authors = [
    {name = "Jason D. McEwen"},
    {name = "Contributors"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]
description = "Differentiable and accelerated spherical convolutions with JAX"
dependencies = [
    "numpy>=1.20",
    "jax>=0.5.0",
    "s2fft>=1.4.0",  # first release compatible with JAX>=0.6 (s2fft<=1.3.0 needs jax<0.6)
    "s2fft>=1.5.0; python_version >= '3.13'",  # the compiled extension of 1.4.0 imports on 3.12 only
]
dynamic = [
    "version",
]
keywords = [
    "spherical convolution",
    "lifting",
    "rotation group",
    "SO(3)",
    "spin",
    "spherical harmonics",
    "Wigner transform",
    "equivariance",
    "JAX",
    "differentiable programming",
]
name = "s2conv"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENCE.txt"]
urls.homepage = "https://github.com/astro-informatics/s2conv"
urls.documentation = "https://astro-informatics.github.io/s2conv"
urls.source = "https://github.com/astro-informatics/s2conv"
urls.issues = "https://github.com/astro-informatics/s2conv/issues"
urls.changelog = "https://github.com/astro-informatics/s2conv/releases"

[project.optional-dependencies]
docs = [
    "sphinx>=5.0.0",
    "pydata-sphinx-theme>=0.12.0",
    "sphinx-copybutton",
]
notebooks = [
    "marimo",
    "matplotlib",
]
ssht = [
    "pyssht",   # SSHT bindings, required by the "jax_ssht" backend
    "ducc0",    # accelerated backend of pyssht, used by s2fft by default
]
tests = [
    "pytest",
    "pytest-cov",
]

[tool.setuptools.packages.find]
include = ["s2conv*"]

[tool.setuptools_scm]
# Pure Python package: the version comes from the git tags.  An untagged
# repository gives a development version of the form 0.1.devN.
version_file = "s2conv/_version.py"
local_scheme = "no-local-version"
fallback_version = "0.0.0.dev0"  # only used if there is no git metadata at all

[tool.pytest.ini_options]
addopts = "--color=yes -v"
pythonpath = [
    ".",  # the working tree, so that the tests import s2conv and the benchmarks from it
]
testpaths = [
    "tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "slow: mark test as slow",
    "ssht: test requiring pyssht",
]

[tool.ruff]
fix = true
force-exclude = true
# The Marimo notebooks have their own format: exclude them from linting and formatting.  The
# logo's generator is kept as its designer wrote it, so that it reproduces the SVGs byte for byte.
extend-exclude = [
    "docs/assets",
    "notebooks",
    "s2conv/_version.py",
]
format.exclude = ["*.ipynb"]
lint.exclude = ["*.ipynb"]
lint.ignore = [
    "B023", # function-uses-loop-variable
    "COM812", # trailing commas (ruff-format recommended)
    "D100", # undocumented-public-module
    "D104", # undocumented-public-package
    "D203", # no-blank-line-before-class
    "D205", # blank line between summary and description in docstrings
    "D212", # multi-line-summary-first-line
    "D401", # non-imperative-mood
    "D407", # removed dashes lines under sections
    "D417", # argument description in docstring (unreliable)
    "ISC001", # simplify implicit str concatenation (ruff-format recommended)
    "S101", # assert
]
lint.per-file-ignores = {"tests*" = [
    "D", # No docstring checks in tests
    "INP001", # File is part of an implicit namespace package.
    "S101", # Use of `assert` detected
], "benchmarks*" = [
    "C901", # the catalogue defines one builder per operator, after the precision is set
    "D", # No docstring checks in the benchmark scripts, as in s2fft
], "__init__.py" = [
    "F401", # unused-import
] }
lint.select = [
    "B",
    "C90",
    "D",
    "E1",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "S",
    "UP",
]
lint.isort.known-first-party = [
    "s2conv"
]
lint.mccabe.max-complexity = 18
lint.pep8-naming.classmethod-decorators = [
    "classmethod",
]
