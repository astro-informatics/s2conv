name: Docs

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/docs.yml
      - pyproject.toml
      - s2conv/**
      - docs/**
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6.0.3
        with:
          # setuptools-scm needs the full history and the tags to determine the version
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      # The package is installed so that autodoc can import it
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[docs]"

      - name: Build documentation
        run: |
          cd docs
          make html

      - name: Upload built docs as artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html
          retention-days: 30

  deploy:
    # Publish to GitHub Pages on pushes to main only.  This requires GitHub Pages
    # to be enabled with "GitHub Actions" as the source in the repository settings.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
