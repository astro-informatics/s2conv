name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - .github/workflows/tests.yml
      - pyproject.toml
      - s2conv/**
      - tests/**
      - .coveragerc
  schedule:
    - cron: 0 0 * * 0
  # Run on demand from the Actions tab, including the slow tests
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    # id-token lets the Codecov step authenticate by OpenID Connect, without a token
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        # Python 3.13 awaits an s2fft release newer than 1.4.0: the compiled extension
        # in its abi3 wheels is built for CPython 3.12 only, so s2fft 1.4.0 fails to
        # import on 3.13 (fixed on s2fft's main branch by #362)
        python-version: ["3.11", "3.12"]
        os: [ubuntu-latest, macos-latest]
      fail-fast: false

    steps:
      - name: Checkout source
        uses: actions/checkout@v6.0.3
        with:
          # setuptools-scm needs the full history and the tags to determine the version
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        # The ssht extra (pyssht and ducc0) provides the "jax_ssht" backend, and
        # pyssht has wheels for all of the platforms and Python versions above
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[tests,ssht]"

      # Run as a module so that the working tree, rather than the installed copy of
      # the package, is imported, and hence measured for coverage
      - name: Run tests (skipping slow tests on pull requests)
        if: github.event_name == 'pull_request'
        run: python -m pytest --cov=s2conv --cov-report=xml --cov-config=.coveragerc -m "not slow"

      - name: Run tests
        if: github.event_name != 'pull_request'
        run: python -m pytest --cov=s2conv --cov-report=xml --cov-config=.coveragerc

      - name: Upload coverage reports to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v6
        with:
          use_oidc: true
